<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>堆叠三消原型 · Stacked Match-3 Prototype</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0c0a09;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #frame {
        position: relative;
        width: min(100vw, calc(100vh * 720 / 1280));
        height: min(100vh, calc(100vw * 1280 / 720));
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="frame"><canvas id="game"></canvas></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
