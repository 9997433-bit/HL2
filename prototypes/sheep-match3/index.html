<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>堆叠三消原型 · Stacked Match-3 Prototype</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0c0a09;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #frame {
        position: relative;
        width: min(100vw, calc(100vh * 720 / 1280));
        height: min(100vh, calc(100vw * 1280 / 720));
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: manipulation;
      }
      /* Stand-ins for the two things WeChat draws itself: the rewarded-video
         overlay and the friend board inside the 开放数据域. */
      .wxpanel {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        max-width: 88%;
        padding: 9px 16px;
        border-radius: 12px;
        background: rgba(28, 25, 23, 0.86);
        color: #fafaf9;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .wxpanel.show {
        opacity: 1;
      }
      #wxad {
        top: 12%;
      }
      #wxboard {
        bottom: 4%;
        background: rgba(63, 98, 18, 0.92);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas id="game"></canvas>
        <div id="wxad" class="wxpanel"></div>
        <div id="wxboard" class="wxpanel"></div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
