<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>叠叠消 Tile Trio — 羊了个羊-style mechanic prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #17212b;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8eef5;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  #stage { position: relative; height: 100vh; aspect-ratio: 480 / 820; max-width: 100vw; }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(14, 20, 27, .88); backdrop-filter: blur(3px); text-align: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .overlay p { margin: 0; font-size: 14px; line-height: 1.7; color: #9fb3c8; max-width: 320px; }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 30px; font-size: 16px; font-weight: 600;
    background: linear-gradient(180deg, #56c271, #3da75a); color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 #2d7f44; font-family: inherit;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2d7f44; }
  .btn.ghost { background: #2b3a4a; box-shadow: 0 4px 0 #1d2833; }
  .btn.ghost:active { box-shadow: 0 2px 0 #1d2833; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  #toast {
    position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 10px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 90%; text-align: center; line-height: 1.5;
  }
  #toast.show { opacity: 1; }
  .tag { display:inline-block; font-size: 11px; color:#8fa3b8; border:1px solid #33475c; border-radius:6px; padding:2px 7px; }

  /* ----- mock 激励视频 (wx.createRewardedVideoAd) ----- */
  #ovAd { background: rgba(6, 10, 14, .96); z-index: 5; gap: 0; }
  .adcard {
    width: 90%; max-width: 330px; background: #101922;
    border: 1px solid #24374a; border-radius: 16px; overflow: hidden;
  }
  .adscreen {
    height: 168px; display: flex; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; font-size: 40px;
    background: linear-gradient(135deg, #2b4a6b, #6b3f7a);
  }
  .adscreen small { font-size: 12px; color: rgba(255,255,255,.75); letter-spacing: 1px; }
  .adprogress { height: 4px; background: #1b2733; }
  .adprogress > i { display: block; height: 100%; width: 0; background: #56c271; transition: width .95s linear; }
  .admeta { padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; }
  .admeta .t { flex: 1; font-size: 13px; line-height: 1.5; }
  .admeta .t em { display: block; font-style: normal; font-size: 10px; color: #61798f; margin-top: 3px; }
  #btnAdSkip {
    border: 0; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-family: inherit;
    background: #2b3a4a; color: #b9cadb; cursor: pointer; white-space: nowrap;
  }

  /* ----- mock 好友排行榜 (wx.getFriendCloudStorage) ----- */
  #board { width: 100%; max-width: 320px; text-align: left; font-size: 13px; }
  #board .hd { font-size: 11px; color: #61798f; margin-bottom: 6px; letter-spacing: 1px; }
  #board .row { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 9px; }
  #board .row.me { background: rgba(86, 194, 113, .17); }
  #board .rk { width: 18px; text-align: right; color: #8fa3b8; }
  #board .av {
    width: 22px; height: 22px; border-radius: 50%; background: #2f4358;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #cfe0f0;
  }
  #board .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .sc { color: #ffd479; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="toast"></div>

  <div class="overlay show" id="ovStart">
    <h2>叠叠消 · Tile Trio</h2>
    <p><span class="tag">mechanic prototype</span><br>
      Tap tiles to send them to the tray. Three of a kind clear.<br>
      Tiles covered by an upper layer are locked.<br>
      Fill all 7 tray slots with no match and you lose.</p>
    <div class="row">
      <button class="btn" data-level="0">第一关 Level 1</button>
      <button class="btn ghost" data-level="1">第二关 Level 2</button>
      <button class="btn ghost" data-level="2">第三关 Level 3</button>
    </div>
  </div>

  <div class="overlay" id="ovEnd">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div id="board"></div>
    <div class="row" id="reviveRow">
      <button class="btn" id="btnAdRevive">🎬 看广告复活</button>
      <button class="btn ghost" id="btnShareRevive">📤 分享复活</button>
    </div>
    <div class="row">
      <button class="btn" id="btnAgain">再来一次 Retry</button>
      <button class="btn ghost" id="btnMenu">选关 Levels</button>
      <button class="btn ghost" id="btnShare">📤 炫耀一下</button>
    </div>
  </div>

  <div class="overlay" id="ovAd">
    <div class="adcard">
      <div class="adscreen">🎬<small id="adCount">MOCK REWARDED VIDEO</small></div>
      <div class="adprogress"><i id="adBar"></i></div>
      <div class="admeta">
        <div class="t"><span id="adTitle"></span><em id="adUnit"></em></div>
        <button id="btnAdSkip">跳过</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared/wx-shim.js"></script>
<script>
/* ------------------------------------------------------------------
   叠叠消 (Tile Trio) — an original re-implementation of the layered
   3-tile-matching mechanic popularised by 羊了个羊 / 猪了个猪, the games
   that have topped WeChat's 畅玩榜 (DAU chart) through 2025-2026.

   Everything here is plain HTML5 Canvas + vanilla JS. Every WeChat-only API is
   called by its real name through `prototypes/shared/wx-shim.js`, which mocks
   the platform off-device and stands aside inside a real 微信小游戏 — so the
   call sites below are the ones that would ship.
------------------------------------------------------------------- */

/* ===== WeChat platform ====================================================
   installWxShim() publishes the mock as `globalThis.wx`; on a real device the
   genuine namespace wins and `shim.isMock` is false. Ads run in 'manual' mode
   so this page can draw the fake video player itself. */
const shim = WxShim.installWxShim({
  adBehavior: 'manual',
  shareBehavior: 'auto',
  shareReturnMs: 900,
  friendCount: 7,
  seed: 20260826
});

const AD_UNITS = {
  prop:   'adunit-tiletrio-prop-9f21',      // 道具：洗牌 / 移出 / 撤销
  revive: 'adunit-tiletrio-revive-4c07'     // 复活
};
const CLOUD_KEY = 'score';                  // 好友榜 KV，沿用微信 wxgame 结构

const AD_SECONDS = 5;                       // fake creative length
let adReason = '', adReward = null, adLeft = 0, adTimer = null;

/* A rewarded ad is a singleton per ad unit and pre-loads itself, so one
   instance is created up front and every prop routes its reward through the
   single onClose handler — the pattern the real SDK forces on you. */
const rewardedAd = wx.createRewardedVideoAd({ adUnitId: AD_UNITS.prop });

rewardedAd.onError(err => {
  adReward = null;
  hideAdOverlay();
  toast('广告拉取失败 ' + err.errCode + '（' + err.errMsg + '）');
});

rewardedAd.onClose(res => {
  hideAdOverlay();
  const grant = adReward;
  adReward = null;
  if (res && res.isEnded) { if (grant) grant(); }
  else toast('提前关闭广告，本次奖励不发放');
});

/** Show a rewarded video and run `onReward` only if it was watched to the end. */
function watchAd(reason, onReward) {
  adReason = reason;
  adReward = onReward;
  rewardedAd.show().catch(() => {
    // Real fallback: the creative was not ready, so load and show again.
    rewardedAd.load()
      .then(() => rewardedAd.show())
      .catch(err => {
        adReward = null;
        toast('暂无广告库存（errCode ' + (err.errCode || 1004) + '），道具未发放');
      });
  });
}

/* The shim only reports that an ad is on screen; drawing it is the host's job,
   exactly as the WeChat SDK draws its own player over the canvas. */
shim.on('ad:show', session => {
  document.getElementById('adTitle').textContent = adReason;
  document.getElementById('adUnit').textContent = session.adUnitId + ' · wx-shim mock';
  document.getElementById('adBar').style.width = '0%';
  adLeft = AD_SECONDS;
  show('ovAd');
  tickAd();
});

function tickAd() {
  const skip = document.getElementById('btnAdSkip');
  document.getElementById('adCount').textContent = adLeft + 's';
  document.getElementById('adBar').style.width =
    Math.round((1 - adLeft / AD_SECONDS) * 100) + '%';
  skip.textContent = adLeft > 0 ? '跳过 (' + adLeft + ')' : '关闭';
  if (adLeft <= 0) { shim.completeAd(); return; }   // watched through -> reward
  adLeft--;
  adTimer = setTimeout(tickAd, 1000);
}

function hideAdOverlay() {
  clearTimeout(adTimer);
  hide('ovAd');
}

/* Score goes to the friend leaderboard in WeChat's own wxgame envelope, which
   is what 开放数据域 排行榜模板 expects to read back. */
function submitScore(score) {
  wx.setUserCloudStorage({
    KVDataList: [
      { key: CLOUD_KEY, value: JSON.stringify({ wxgame: { score, update_time: Math.floor(Date.now() / 1000) } }) },
      { key: 'level', value: String(levelIdx + 1) }
    ]
  });
}

function readScore(kvList) {
  const kv = kvList.find(k => k.key === CLOUD_KEY);
  if (!kv) return 0;
  try { return Number(JSON.parse(kv.value).wxgame.score) || 0; } catch (e) { return 0; }
}

/** Render the friend board. On a real device this HTML would instead be drawn
    into the 开放数据域 sub-canvas — the main context cannot read friend data. */
function showLeaderboard() {
  wx.getFriendCloudStorage({
    keyList: [CLOUD_KEY],
    success: res => {
      const rows = res.data
        .map(u => ({ name: u.nickname, score: readScore(u.KVDataList), me: u.openid === shim.config.self.openid }))
        .sort((a, b) => b.score - a.score);
      document.getElementById('board').innerHTML =
        '<div class="hd">好友榜 · wx.getFriendCloudStorage（mock ' + rows.length + ' 人）</div>' +
        rows.map((r, i) =>
          '<div class="row' + (r.me ? ' me' : '') + '">' +
            '<span class="rk">' + (i + 1) + '</span>' +
            '<span class="av">' + r.name.slice(0, 1) + '</span>' +
            '<span class="nm">' + r.name + '</span>' +
            '<span class="sc">' + r.score + '</span>' +
          '</div>').join('');
    }
  });
}

/* ===== constants ========================================================== */
const W = 480, H = 820;
const TILE = 44;              // logical tile edge
const LAYER_OFFSET = 3;       // px each layer is nudged up-left, for depth
const TRAY_SLOTS = 7;
const TRAY_Y = 636;
const TRAY_TILE = 46;
const BOARD_TOP = 104;
const CX = W / 2;

const SYMBOLS = ['🌿','🍄','🌰','🍁','🌻','🪵','🍇','🐚','🌸','🍋','🥕','⭐'];
const COLORS  = ['#cfe8b6','#f3c9c0','#e2cdaa','#f0c9a0','#ffe9a8','#d8c3a5',
                 '#d3bde8','#bcdce8','#f6c9dd','#f7eeaa','#f8cfa4','#cfe3f7'];

const LEVELS = [
  { name: 'Level 1 · 入门', types: 6,  pyramid: [[5,3],[4,2],[3,1]], stack: 4  },
  { name: 'Level 2 · 地狱', types: 9,  pyramid: [[6,4],[5,3],[4,2],[3,1]], stack: 7 },
  { name: 'Level 3 · 深渊', types: 12, pyramid: [[7,5],[6,4],[5,3],[4,2],[3,1]], stack: 11 }
];

/* ===== canvas setup ======================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ===== state ============================================================== */
let tiles = [];      // every tile ever dealt this level
let tray = [];       // tile refs currently in the tray, in display order
let history = [];    // tile refs, for undo
let props = { shuffle: 0, pull: 0, undo: 0 };
let levelIdx = 0;
let running = false;
let levelStart = 0;
let shakeUntil = 0, shakeTile = null;

/* ===== layout generation ==================================================
   A pyramid of half-step-offset layers plus one deep single-column stack —
   the "you can only ever see the top of it" pile that makes 羊了个羊 level 2
   infamous. */
function buildPositions(spec) {
  const pos = [];
  spec.pyramid.forEach((dim, L) => {
    const [cols, rows] = dim;
    const startX = CX - (cols * TILE) / 2;
    const startY = BOARD_TOP + L * (TILE / 2);
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        pos.push({ x: startX + c * TILE, y: startY + r * TILE, layer: L });
  });
  const pyramidBottom = BOARD_TOP + spec.pyramid[0][1] * TILE;
  const sx = CX - TILE / 2, sy = pyramidBottom + 46;
  for (let L = 0; L < spec.stack; L++) pos.push({ x: sx, y: sy, layer: L });

  // Centre whatever we built in the play area so small levels aren't stranded
  // at the top of the screen.
  const top = Math.min(...pos.map(p => p.y - p.layer * LAYER_OFFSET));
  const bottom = Math.max(...pos.map(p => p.y)) + TILE;
  const shift = (BOARD_TOP + (TRAY_Y - 44 - BOARD_TOP - (bottom - top)) / 2) - top;
  pos.forEach(p => { p.y += shift; });
  return pos;
}

/* Two tiles collide when their drawn rects overlap. A tile is locked while any
   *higher* layer tile still overlaps it. */
function rect(t) {
  const o = t.layer * LAYER_OFFSET;
  return { x: t.bx - o, y: t.by - o, w: TILE, h: TILE };
}
function overlaps(a, b) {
  const ra = rect(a), rb = rect(b);
  return ra.x < rb.x + rb.w && rb.x < ra.x + ra.w &&
         ra.y < rb.y + rb.h && rb.y < ra.y + ra.h;
}

/* Peel the board top-down: repeatedly take a random currently-uncovered tile.
   Because the covering relation is a DAG this always consumes every tile, and
   the resulting sequence is a legal removal order. */
function peelOrder(pool) {
  const left = pool.slice(), out = [];
  while (left.length) {
    const free = left.filter(t => !left.some(o => o !== t && o.layer > t.layer && overlaps(o, t)));
    const pick = free[(Math.random() * free.length) | 0];
    out.push(pick);
    left.splice(left.indexOf(pick), 1);
  }
  return out;
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Painting symbols onto a legal removal order makes the deal solvable by
   construction — there are no dead layouts. We take the order six at a time and
   split each block into two spatially coherent triples: still solvable (the tray
   never exceeds 4 on the intended line), but matching symbols land near each
   other so a human can actually spot them instead of scanning the whole board. */
function dealSymbols(order, typeCount) {
  const bag = [];
  for (let i = 0; i < Math.ceil(order.length / 3); i++) bag.push(i % typeCount);
  shuffleArr(bag);
  let bi = 0;
  const dist = (a, b) => Math.hypot(a.bx - b.bx, a.by - b.by) + Math.abs(a.layer - b.layer) * 4;
  const paint = (g, type) => g.forEach(t => { t.type = type; });
  for (let b = 0; b < order.length; b += 6) {
    const block = order.slice(b, b + 6);
    if (block.length === 6) {
      const a = block[0];
      const rest = block.slice(1).sort((p, q) => dist(a, p) - dist(a, q));
      paint([a, rest[0], rest[1]], bag[bi++]);
      paint(rest.slice(2), bag[bi++]);
    } else {
      paint(block, bag[bi++]);
    }
  }
}

function startLevel(idx) {
  levelIdx = idx;
  const spec = LEVELS[idx];
  const pos = buildPositions(spec);
  if (pos.length % 3 !== 0) console.warn('layout not divisible by 3:', pos.length);

  tiles = pos.map((p, i) => ({
    id: i, bx: p.x, by: p.y, layer: p.layer, type: 0,
    state: 'board',           // board | tray | gone
    x: p.x - p.layer * LAYER_OFFSET, y: p.y - p.layer * LAYER_OFFSET,
    tx: 0, ty: 0, scale: 1, pop: 0
  }));
  dealSymbols(peelOrder(tiles), spec.types);
  tiles.forEach(t => { t.tx = t.x; t.ty = t.y; });

  tray = []; history = [];
  props = { shuffle: 1, pull: 1, undo: 1 };   // free uses; after that, watch an ad
  running = true;
  levelStart = Date.now();
  hide('ovStart'); hide('ovEnd'); hide('ovAd');
  document.getElementById('board').innerHTML = '';
  layoutTray();
}

/* ===== tray =============================================================== */
function trayX(i) { return CX - (TRAY_SLOTS * TRAY_TILE) / 2 + i * TRAY_TILE; }
function layoutTray() {
  tray.forEach((t, i) => { t.tx = trayX(i) + (TRAY_TILE - TILE) / 2; t.ty = TRAY_Y + 3; });
}

function sendToTray(t) {
  t.state = 'tray';
  // Same symbols group together, exactly like the real thing.
  let at = -1;
  for (let i = tray.length - 1; i >= 0; i--) if (tray[i].type === t.type) { at = i; break; }
  if (at >= 0) tray.splice(at + 1, 0, t); else tray.push(t);
  history.push(t);
  layoutTray();
  wx.vibrateShort({ type: 'light' });

  const same = tray.filter(x => x.type === t.type);
  if (same.length >= 3) {
    setTimeout(() => {
      same.slice(0, 3).forEach(x => {
        x.state = 'gone'; x.pop = 1;
        tray.splice(tray.indexOf(x), 1);
        const h = history.indexOf(x); if (h >= 0) history.splice(h, 1);
      });
      layoutTray();
      wx.vibrateLong();
      check();
    }, 130);
  } else {
    check();
  }
}

/* Faster clears score higher, so the friend board has something to rank. */
function levelScore() {
  const elapsed = (Date.now() - levelStart) / 1000;
  return (levelIdx + 1) * 1000 + Math.max(0, Math.round(600 - elapsed * 4));
}

function check() {
  if (!running) return;
  if (tiles.every(t => t.state === 'gone')) {
    running = false;
    submitScore(levelScore());
    setTimeout(() => end(true), 350);
  } else if (tray.length >= TRAY_SLOTS) {
    running = false;
    setTimeout(() => end(false), 250);
  }
}

/* ===== props ==============================================================
   The genre's actual monetisation: one free use per level, then every further
   use costs a 激励视频. `withProp` is the whole IAA loop in eight lines. */
function withProp(key, reason, action) {
  if (!running) return false;
  if (props[key] > 0) { props[key]--; action(); return true; }
  watchAd('看广告获得「' + reason + '」', action);
  return true;
}

function useShuffle() {
  if (!running) return;
  withProp('shuffle', '洗牌 Shuffle', () => {
    const board = tiles.filter(t => t.state === 'board');
    const order = peelOrder(board);
    const need = {};                                     // finish what's in the tray first
    tray.forEach(t => { need[t.type] = (need[t.type] || 0) + 1; });
    const counts = {};
    board.forEach(t => { counts[t.type] = (counts[t.type] || 0) + 1; });
    let i = 0;
    for (const k in need) {
      const type = +k;
      for (let n = 0; n < 3 - need[k] && i < order.length; n++, i++) {
        order[i].type = type; counts[type]--;
      }
    }
    const bag = [];
    for (const k in counts) for (let n = 0; n < counts[k] / 3; n++) bag.push(+k);
    shuffleArr(bag);
    let bi = 0;
    while (i < order.length) {
      const type = bag[bi++];
      for (let n = 0; n < 3 && i < order.length; n++) order[i++].type = type;
    }
  });
}

/** Send the first three tray tiles back to the board, on a free top layer. */
function pullOut() {
  const top = Math.max(...tiles.map(t => t.layer)) + 1;
  tray.splice(0, 3).forEach((t, i) => {
    t.state = 'board'; t.layer = top;                    // returned tiles land on top, always free
    t.bx = CX - TILE * 1.5 + i * TILE; t.by = TRAY_Y - 92;
    const h = history.indexOf(t); if (h >= 0) history.splice(h, 1);
  });
  layoutTray();
}

function usePull() {
  if (!running) return;
  if (tray.length === 0) return toast('槽位是空的');
  withProp('pull', '移出 Pull out — 取回槽内 3 张', pullOut);
}

function useUndo() {
  if (!running) return;
  if (!history.length) return toast('没有可撤销的操作');
  withProp('undo', '撤销 Undo', () => {
    const t = history.pop();
    tray.splice(tray.indexOf(t), 1);
    t.state = 'board';
    t.tx = t.bx - t.layer * LAYER_OFFSET; t.ty = t.by - t.layer * LAYER_OFFSET;
    layoutTray();
  });
}

/* ===== input ============================================================== */
function pointFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: (p.clientX - r.left) / r.width * W, y: (p.clientY - r.top) / r.height * H };
}
function hit(pt) {
  const board = tiles.filter(t => t.state === 'board').sort((a, b) => b.layer - a.layer);
  for (const t of board) {
    const r = rect(t);
    if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) return t;
  }
  return null;
}
function isLocked(t) {
  return tiles.some(o => o.state === 'board' && o.layer > t.layer && overlaps(o, t));
}

const BTNS = [
  { x: CX - 168, y: 726, w: 104, h: 46, label: '🔀 洗牌', key: 'shuffle', fn: useShuffle },
  { x: CX - 52,  y: 726, w: 104, h: 46, label: '⤴️ 移出', key: 'pull',    fn: usePull },
  { x: CX + 64,  y: 726, w: 104, h: 46, label: '↩️ 撤销', key: 'undo',    fn: useUndo }
];

function onTap(e) {
  e.preventDefault();
  const pt = pointFromEvent(e);
  for (const b of BTNS)
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) return b.fn();
  if (!running) return;
  const t = hit(pt);
  if (!t) return;
  if (isLocked(t)) { shakeTile = t; shakeUntil = performance.now() + 260; return; }
  sendToTray(t);
}
cv.addEventListener('pointerdown', onTap);

/* ===== drawing ============================================================ */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTile(t, size, locked) {
  const s = size * t.scale;
  const x = t.x + (size - s) / 2, y = t.y + (size - s) / 2;
  ctx.save();
  if (t === shakeTile && performance.now() < shakeUntil)
    ctx.translate(Math.sin(performance.now() / 18) * 4, 0);

  ctx.fillStyle = 'rgba(0,0,0,.38)';
  roundRect(x + 2, y + 4, s, s, 9); ctx.fill();

  // Covered tiles keep their own colour and are shaded instead of blanked out,
  // so the eye can still read the depth of a stack.
  ctx.fillStyle = COLORS[t.type % COLORS.length];
  roundRect(x, y, s, s, 9); ctx.fill();
  if (locked) { ctx.fillStyle = 'rgba(11,18,26,.55)'; roundRect(x, y, s, s, 9); ctx.fill(); }
  ctx.lineWidth = 2;
  ctx.strokeStyle = locked ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.62)';
  ctx.stroke();

  ctx.globalAlpha = locked ? 0.5 : 1;
  ctx.font = (s * 0.58) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(SYMBOLS[t.type % SYMBOLS.length], x + s / 2, y + s / 2 + 1);
  ctx.restore();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1d2c3a'); g.addColorStop(1, '#121a23');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // header
  const left = tiles.filter(t => t.state === 'board').length;
  ctx.fillStyle = '#e8eef5'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 20px sans-serif';
  ctx.fillText(LEVELS[levelIdx].name, 22, 44);
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#8fa8bf';
  ctx.fillText('剩余 ' + left + ' 张 · 槽位 ' + tray.length + '/' + TRAY_SLOTS, 22, 66);
  ctx.textAlign = 'right'; ctx.fillStyle = '#617d99';
  ctx.font = '11px sans-serif';
  ctx.fillText(shim.isMock ? 'wx-shim mock · 广告/分享/好友榜' : '微信小游戏 · 真实 wx SDK', W - 22, 66);

  // board, painted bottom layer first
  const board = tiles.filter(t => t.state === 'board').sort((a, b) => a.layer - b.layer || a.by - b.by);
  board.forEach(t => drawTile(t, TILE, isLocked(t)));

  // tray
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  roundRect(CX - (TRAY_SLOTS * TRAY_TILE) / 2 - 8, TRAY_Y - 8, TRAY_SLOTS * TRAY_TILE + 16, TRAY_TILE + 16, 14);
  ctx.fill();
  for (let i = 0; i < TRAY_SLOTS; i++) {
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1.5;
    roundRect(trayX(i) + 2, TRAY_Y + 1, TRAY_TILE - 4, TRAY_TILE - 4, 8); ctx.stroke();
  }
  tray.forEach(t => drawTile(t, TILE, false));

  // pop animation for cleared tiles
  tiles.filter(t => t.pop > 0).forEach(t => {
    ctx.save(); ctx.globalAlpha = t.pop;
    ctx.strokeStyle = '#7ee08f'; ctx.lineWidth = 3;
    const r = (1 - t.pop) * 26 + 8;
    ctx.beginPath(); ctx.arc(t.x + TILE / 2, t.y + TILE / 2, r, 0, 6.284); ctx.stroke();
    ctx.restore();
    t.pop = Math.max(0, t.pop - 0.05);
  });

  // prop buttons — 🎬 marks the ones that now cost a rewarded video
  BTNS.forEach(b => {
    const n = props[b.key];
    ctx.fillStyle = n > 0 ? '#2f4358' : '#3a3350';
    roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.fillStyle = '#e8eef5';
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label + (n > 0 ? ' ×' + n : ' 🎬'), b.x + b.w / 2, b.y + b.h / 2);
  });
}

function tick() {
  tiles.forEach(t => {
    t.x += (t.tx - t.x) * 0.30;
    t.y += (t.ty - t.y) * 0.30;
  });
  draw();
  requestAnimationFrame(tick);
}
tick();

/* ===== ui glue ============================================================ */
function show(id) { document.getElementById(id).classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

let revived = false;

function end(win) {
  document.getElementById('endTitle').textContent = win ? '通关！ 🎉' : '槽位满了 💀';
  document.getElementById('endText').innerHTML = win
    ? LEVELS[levelIdx].name + ' 全部消除，得分 ' + levelScore() +
      '。<br>成绩已写入 wx.setUserCloudStorage，好友榜由 wx.getFriendCloudStorage 读回。'
    : '七个槽位被占满且无法凑齐三张。<br>看广告或分享给好友即可复活 —— 该品类的变现与传播闭环。';
  document.getElementById('reviveRow').style.display = (!win && !revived) ? 'flex' : 'none';
  if (win) showLeaderboard(); else document.getElementById('board').innerHTML = '';
  show('ovEnd');
}

/** One revive per run, from either an ad or a share. */
function revive(how) {
  revived = true;
  running = true;
  hide('ovEnd');
  pullOut();
  toast('复活成功（' + how + '）：槽内 3 张已退回牌面');
}

document.querySelectorAll('[data-level]').forEach(b =>
  b.addEventListener('click', () => { revived = false; startLevel(+b.dataset.level); }));
document.getElementById('btnAgain').addEventListener('click', () => { revived = false; startLevel(levelIdx); });
document.getElementById('btnMenu').addEventListener('click', () => { hide('ovEnd'); show('ovStart'); });

document.getElementById('btnAdSkip').addEventListener('click', () => {
  // Closing early is the interesting branch: onClose reports isEnded:false.
  if (adLeft > 0) shim.skipAd(); else shim.completeAd();
});

document.getElementById('btnAdRevive').addEventListener('click', () =>
  watchAd('复活 Revive — 退回槽内 3 张', () => revive('激励视频')));

/* wx.shareAppMessage has no success callback on the real platform; a game can
   only react to the user coming back with a shareTicket. The shim replays that
   round trip as `share:success`, so the revive is wired to the return, not to
   the share call. */
document.getElementById('btnShareRevive').addEventListener('click', () => {
  toast('已拉起分享面板，等待好友打开卡片…');
  shim.once('share:success', info =>
    revive('分享回流 · scene ' + info.scene + ' · 来自 ' + (info.from ? info.from.nickname : '好友')));
  wx.shareAppMessage({
    title: '我卡在' + LEVELS[levelIdx].name + '了，帮我一把！',
    imageUrl: 'assets/share-card.png',
    query: 'level=' + (levelIdx + 1) + '&from=revive'
  });
});

document.getElementById('btnShare').addEventListener('click', () => {
  wx.shareAppMessage({
    title: '我在叠叠消通关了' + LEVELS[levelIdx].name + '，来挑战我 ' + levelScore() + ' 分',
    imageUrl: 'assets/share-card.png',
    query: 'level=' + (levelIdx + 1) + '&from=brag'
  });
  toast('📤 wx.shareAppMessage 已调用（平台不返回成功回调）');
});

/* Coming back through a share card is a real re-entry: WeChat fires onShow with
   the scene value and the ticket. */
wx.onShow(res => {
  if (res.shareTicket) console.info('[tile-trio] 分享回流 scene=' + res.scene + ' ticket=' + res.shareTicket);
});

// ?level=2 deep-links straight into a level, for demos and headless testing
const deep = new URLSearchParams(location.search).get('level');
if (deep !== null && LEVELS[+deep - 1]) startLevel(+deep - 1);
</script>
